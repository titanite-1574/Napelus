# Details
unit.nap-03c-pain.details = I'm sure this will work on the ice wall. I'm sure this is legal since the Geneva Convention doesn't exist here
unit.nap-01d-contention.details = The ancestors of the skyrail units, which inspired the Storm flying unit and dispute. How did they get here? Interplanetary lauch pads from [red][REDACTED]
unit.nap-landfall.details = Stealthy and fast,commonly used as scouting helis by Aralus to observe the landscape of Napelus and spot enemy treats. It has gone through many changes from weight distribution to noise cancelling. Its lightweight body makes it capable of carrying units and multiple turrets,which was used during the [red] 3 Sided Conflict.[white] They carry backup units in its cargo bay to deploy incase it gets shot down. [red] deals devastating damage when crashing due to its special reactor.


